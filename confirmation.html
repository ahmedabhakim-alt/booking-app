<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تأكيد الحجز</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5;text-align:center}
.box{background:white;padding:30px;border-radius:10px;max-width:500px;margin:50px auto}
.success{font-size:50px}
button{background:#003580;color:white;padding:12px 20px;border:none;border-radius:5px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<div class="success">✅</div>
<h2>تم تأكيد حجزك!</h2>
<div id="info"></div>
<button onclick="window.location='index.html'">حجز جديد</button>
</div>
<script>
let b=JSON.parse(localStorage.getItem("lastBooking")||"{}");
if(!b.id){b={id:"BK-12345",hotel:"فندق تجريبي",checkin:"2026-10-27",checkout:"2026-10-28",total:1200,name:"Ahmed"};}
document.getElementById("info").innerHTML=`<p><b>رقم الحجز:</b> ${b.id}</p><p><b>الفندق:</b> ${b.hotel}</p><p><b>من:</b> ${b.checkin} <b>إلى:</b> ${b.checkout}</p><p><b>الإجمالي:</b> ${b.total} جنيه</p><p><b>باسم:</b> ${b.name}</p><p>تم إرسال التأكيد على الإيميل - مجاني الإلغاء لمدة 24 ساعة</p><p style="color:green"><b>تم الحفظ في LocalStorage - My Bookings</b></p>`;
// Save to my bookings list
let all=JSON.parse(localStorage.getItem("myBookings")||"[]");
all.push(b);
localStorage.setItem("myBookings",JSON.stringify(all));
</script>
</body>
</html>
